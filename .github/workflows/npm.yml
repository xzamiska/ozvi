name: npm packages
# Stages @ozvi/sdk and @ozvi/widget (MIT) for publishing when their version in package.json is not on npm yet,
# on every release tag and by hand. No npm token: trusted publishing (OIDC) gives each run a short-lived
# credential; on npmjs.com each package lists this repository and workflow as its trusted publisher.
# The first version of each package is published by hand (see ozvi-internal/HANDOFF.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ozvi/sdk test && pnpm --filter @ozvi/widget test
      - name: Publish what is new
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkgs"
          for dir in packages/sdk packages/widget; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            if npm stage list "$name" 2>/dev/null | grep -qF "$version"; then
              echo "$name@$version is already staged, waiting for approval"
              continue
            fi
            # pnpm pack does NOT run prepublishOnly: build first, then pack (applies publishConfig.exports).
            pnpm --filter "$name" build
            tgz=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/pkgs" | tail -1)
            # Never publish a package without its compiled code (an empty 1.1.0 nearly went out this way).
            entry=$(node -p "const p=require('./$dir/package.json'); const e=(p.publishConfig?.exports??p.exports)['.']; (e.import||e.default||e).replace(/^\.\//,'')")
            tar -tzf "$tgz" | grep -qx "package/$entry" || { echo "::error::$name: $entry missing in $tgz"; exit 1; }
            # Staged: OIDC + provenance put it in npm's stage queue; a maintainer approves it with 2FA
            # (npmjs.com or `npm stage approve <id>`). The trusted publishers allow only `npm stage publish`.
            echo "staging $name@$version"
            npm stage publish "$tgz" --access public --provenance
          done
